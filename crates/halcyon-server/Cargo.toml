[package]
name = "halcyon-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "2.0.21"
glommio = { package = "glommio-ng", version = "0.12" }

mc_protocol = { version = "0.1.0", path = "../mc-protocol" }
halcyon-world = { version = "0.1.0", path = "../halcyon-world" }
halcyon-commands = { version = "0.1.0", path = "../halcyon-commands" }
mimalloc = "0.1.52"
futures-lite = "2.6.1"
openssl = "0.10.81"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }

[[bin]]
name = "halcyon"
path = "src/main.rs"
